<div class="home-page">
  @for (pokemon of pokemons; track pokemon.id) {
    <a
      class="home-page__card-link"
      [routerLink]="['/pokemon', pokemon.id]"
    >
      <app-pokemon-card
        [pokemon]="pokemon"
        variant="list"
      />
    </a>
  }

  @if (hasMore && !searchTerm) {
    <div class="home-page__load-more">
      <button (click)="loadMore()">Load more...</button>
    </div>
  }
</div>
